<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM — Probabilités &amp; Statistiques</title>

<style>
:root{
  --bg:#F2EEE9;
  --bleu:#2E5FA3; --bleu-l:#EAF0FB;
  --vert:#1A8C68; --vert-l:#E4F5EF;
  --rouge:#C04010; --rouge-l:#FBF0EB;
  --or:#B07010; --or-l:#FBF3E4;
  --violet:#7B3FA0; --violet-l:#F3EBF9;
  --rose:#B8387A; --rose-l:#FCF0F5;
  --cyan:#1A7A8C; --cyan-l:#E3F4F7;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:#1a1a1a;padding-bottom:5rem;}

/* ── HEADER ── */
.header{background:linear-gradient(135deg,#1A7A8C 0%,#2E5FA3 100%);padding:1.4rem 1.5rem 1rem;position:sticky;top:0;z-index:100;box-shadow:0 3px 14px rgba(0,0,0,.18);}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:.5rem;max-width:980px;margin:0 auto;}
.header h1{font-family:'Lora',serif;font-size:1.2rem;font-weight:700;color:white;line-height:1.2;}
.header p{font-size:.78rem;color:rgba(255,255,255,.78);margin-top:3px;}
.hright{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;}
.score-pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:.28rem .9rem;font-size:.85rem;font-weight:600;color:white;white-space:nowrap;}
.btn-reset{background:white;color:var(--bleu);border:none;border-radius:20px;padding:.28rem .9rem;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-reset:hover{opacity:.85;}
.pbar-wrap{max-width:980px;margin:.75rem auto 0;height:5px;background:rgba(255,255,255,.2);border-radius:3px;}
.pbar{height:100%;background:#7FD4B5;border-radius:3px;transition:width .4s;}

/* ── CATÉGORIES ── */
.cats{max-width:980px;margin:1.1rem auto .3rem;padding:0 1rem;display:flex;flex-wrap:wrap;gap:.45rem;}
.cpill{font-size:.7rem;font-weight:700;padding:.22rem .7rem;border-radius:20px;border:none;cursor:pointer;letter-spacing:.05em;text-transform:uppercase;transition:opacity .15s,transform .1s;}
.cpill:hover{opacity:.8;transform:translateY(-1px);}
.cpill.off{opacity:.35;}
.cp1{background:#D6EEF5;color:var(--cyan);}
.cp2{background:#EBE0F5;color:var(--violet);}
.cp3{background:#D6F0E8;color:var(--vert);}
.cp4{background:#FAE0D6;color:var(--rouge);}
.cp5{background:#F5D6EA;color:var(--rose);}
.cp6{background:#F5EDD6;color:var(--or);}

/* ── RESULT BAR ── */
.resbar{max-width:980px;margin:.5rem auto 1rem;padding:0 1rem;display:none;}
.resbar.show{display:block;}
.resinner{background:linear-gradient(135deg,#1A7A8C,#2E5FA3);border-radius:10px;padding:1rem 1.4rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;}
.resinner h2{font-family:'Lora',serif;font-size:1rem;color:white;}
.resinner p{font-size:.82rem;color:rgba(255,255,255,.8);}
.resscore{font-family:'Lora',serif;font-size:2rem;font-weight:700;color:white;}

/* ── GRID ── */
.grid{max-width:980px;margin:0 auto;padding:0 1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1rem;}

/* ── QCARD ── */
.qcard{background:white;border-radius:11px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07);transition:box-shadow .2s;}
.qcard:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);}
.qcard.correct{box-shadow:0 0 0 2px var(--vert);}
.qcard.wrong{box-shadow:0 0 0 2px var(--rouge);}
.qcard.hidden{display:none;}

.qhead{padding:.55rem .95rem;display:flex;align-items:center;gap:.5rem;}
.qhead span.cat-label{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:white;flex:1;}
.qhead .qnum{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:white;flex-shrink:0;}

.q-text{padding:.8rem .95rem .7rem;font-size:.865rem;line-height:1.6;min-height:60px;border-bottom:1px solid #f0f0f0;}
.q-data{padding:.4rem .95rem .2rem;font-size:.8rem;background:#f9f9f9;border-bottom:1px solid #eee;font-family:'Source Code Pro',monospace;color:#333;line-height:1.6;}

.choices{padding:.55rem .95rem .75rem;display:flex;flex-direction:column;gap:.38rem;}
.cbtn{font-family:inherit;font-size:.82rem;padding:.4rem .75rem;border-radius:6px;border:1.5px solid #e0e0e0;background:white;cursor:pointer;text-align:left;line-height:1.4;color:#2a2a2a;transition:background .1s,border-color .1s,transform .08s;}
.cbtn:hover:not(:disabled){background:#f5f5f5;border-color:#bbb;transform:translateX(2px);}
.cbtn:disabled{cursor:default;}
.cbtn.ok{background:var(--vert-l);border-color:var(--vert);color:#0f4030;font-weight:600;}
.cbtn.ko{background:var(--rouge-l);border-color:var(--rouge);color:#7a1a00;font-weight:600;}
.cbtn.reveal{background:var(--vert-l);border-color:var(--vert);color:#0f4030;}

.fb{padding:.3rem .95rem .65rem;font-size:.78rem;line-height:1.5;display:none;}
.fb.show{display:block;}
.fb.ok{color:var(--vert);}
.fb.ko{color:var(--rouge);}

/* couleurs par cat */
.cat1 .qhead{background:var(--cyan);}
.cat2 .qhead{background:var(--violet);}
.cat3 .qhead{background:var(--vert);}
.cat4 .qhead{background:var(--rouge);}
.cat5 .qhead{background:var(--rose);}
.cat6 .qhead{background:var(--or);}

@media(max-width:500px){.grid{grid-template-columns:1fr;}}
@media print{body{background:white;}.qcard{box-shadow:none;border:1px solid #ddd;}.fb{display:block!important;}}
</style>
</head>

<div class="header">
  <div class="header-top">
    <div>
      <h1>QCM — Probabilités &amp; Statistiques</h1>
      <p>Quartiles · Interquartile · Médiane · Probas conditionnelles · Variables aléatoires · Boîtes à moustaches</p>
    </div>
    <div class="hright">
      <div class="score-pill" id="scorePill">0 / 0</div>
      <button class="btn-reset" onclick="resetAll()">Recommencer</button>

  </div>
  <div class="pbar-wrap"><div class="pbar" id="pbar" style="width:0%"></div></div>
</div>

  <button class="cpill cp2" data-cat="cat2" onclick="filterCat(this)">📊 Boîte à moustaches</button>
  <button class="cpill cp3" data-cat="cat3" onclick="filterCat(this)">🎲 Probas simples</button>
  <button class="cpill cp4" data-cat="cat4" onclick="filterCat(this)">🌿 Probas conditionnelles</button>
  <button class="cpill cp5" data-cat="cat5" onclick="filterCat(this)">🔢 Variables aléatoires</button>

</div>

<div class="resbar" id="resbar">

    <div><h2 id="resTitle"></h2><p id="resMsg"></p></div>
    <div class="resscore" id="resScore"></div>
  </div>
</div>

<div class="grid" id="grid"></div>

let answered = 0, scoreOk = 0;
const active = new Set(['cat1','cat2','cat3','cat4','cat5','cat6']);

function build(){
  const g = document.getElementById('grid');
  g.innerHTML = '';
  QS.forEach((q,i)=>{
    const d = document.createElement('div');
    d.className = `qcard ${q.cat}`;
    d.id = `q${i}`;
    if(!active.has(q.cat)) d.classList.add('hidden');
    const dataHtml = q.data ? `<div class="q-data">${q.data}</div>` : '';
    d.innerHTML = `
      <div class="qhead">
        <div class="qnum">${i+1}</div>
        <span class="cat-label">${q.label}</span>
      </div>
      <div class="q-text">${q.q}</div>
      ${dataHtml}
      <div class="choices">
        ${q.choices.map((c,ci)=>`<button class="cbtn" data-qi="${i}" data-ci="${ci}" onclick="ans(${i},${ci})">${c}</button>`).join('')}
      </div>
      <div class="fb" id="fb${i}"></div>
    `;
    g.appendChild(d);
  });
  if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
}

function ans(qi,ci){
  const q = QS[qi];
  const card = document.getElementById(`q${qi}`);
  if(card.classList.contains('done')) return;
  card.classList.add('done');
  answered++;

  const btns = card.querySelectorAll('.cbtn');
  btns.forEach(b=>b.disabled=true);
  const fb = document.getElementById(`fb${qi}`);

  if(ci===q.correct){
    scoreOk++;
    btns[ci].classList.add('ok');
    card.classList.add('correct');
    fb.className='fb show ok';
    fb.innerHTML=`✓ ${q.expl}`;
  } else {
    btns[ci].classList.add('ko');
    btns[q.correct].classList.add('reveal');
    card.classList.add('wrong');
    fb.className='fb show ko';
    fb.innerHTML=`✗ ${q.expl}`;
  }

  updateScore();
  if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([fb]);

  const visible = QS.filter((_,i)=>active.has(QS[i].cat)).length;
  if(answered>=visible) showResult();
}

function updateScore(){
  document.getElementById('scorePill').textContent=`${scoreOk} / ${answered}`;
  const total = QS.filter((_,i)=>active.has(QS[i].cat)).length;
  document.getElementById('pbar').style.width=`${(answered/total)*100}%`;
}

function showResult(){
  const bar = document.getElementById('resbar');
  bar.classList.add('show');
  const pct = Math.round((scoreOk/answered)*100);
  document.getElementById('resScore').textContent=`${scoreOk}/${answered}`;
  document.getElementById('resTitle').textContent = pct>=80?'🎉 Excellent !':pct>=60?'👍 Bien joué !':'📚 À retravailler';
  document.getElementById('resMsg').textContent=`${pct}% de bonnes réponses`;
  bar.scrollIntoView({behavior:'smooth'});
}

function filterCat(btn){
  const cat = btn.dataset.cat;
  if(active.has(cat)){
    if(active.size===1) return;
    active.delete(cat);
    btn.classList.add('off');
  } else {
    active.add(cat);
    btn.classList.remove('off');
  }
  QS.forEach((_,i)=>{
    const c = document.getElementById(`q${i}`);
    active.has(QS[i].cat) ? c.classList.remove('hidden') : c.classList.add('hidden');
  });
  answered=0; scoreOk=0;
  QS.forEach((_,i)=>{
    const c=document.getElementById(`q${i}`);
    if(active.has(QS[i].cat)&&c.classList.contains('done')){
      answered++;
      if(c.classList.contains('correct')) scoreOk++;
    }
  });
  updateScore();
}

function resetAll(){
  answered=0; scoreOk=0;
  document.getElementById('resbar').classList.remove('show');
  document.getElementById('pbar').style.width='0%';
  document.getElementById('scorePill').textContent='0 / 0';
  build();
}

build();
</script>
